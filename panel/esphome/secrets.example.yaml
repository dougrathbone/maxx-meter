# Copy to secrets.yaml — install script generates this after MaxxMeter bootstrap

wifi_ssid: "YOUR_WIFI"
wifi_password: "YOUR_WIFI_PASSWORD"

collector_host: "192.168.1.7"

# Filled by install-office-panel.ps1 from add-on bootstrap logs
panel_id: "panel_xxx"
panel_api_key: "xxx"
panel_api_key_bearer: "Bearer xxx"

# Copy from your existing office-panel ESPHome config (Dashboard → Edit → API section)
api_encryption_key: "paste-existing-key"
ota_password: "paste-existing-ota-password"

# Interim US portrait UI (until you build maxxmeter_us_portrait.tft in Nextion Editor)
nextion_update_url_us: "https://raw.githubusercontent.com/edwardtfn/NSPanel-Easy/main/hmi/nspanel_portrait.tft"
