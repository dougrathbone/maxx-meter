# ESPHome secrets example
# Copy to secrets.yaml when flashing MaxxMeter panel firmware

wifi_ssid: "YourWiFi"
wifi_password: "YourPassword"

# Home Assistant host running MaxxMeter add-on
collector_host: "homeassistant.local"

# From MaxxMeter ingress → Panels
panel_id: "panel_abc123"
panel_api_key: "your-panel-api-key-here"
panel_api_key_bearer: "Bearer your-panel-api-key-here"

api_encryption_key: "generate-with-esphome"
ota_password: "choose-a-password"
