# Shared ESPHome base for MaxxMeter NSPanel profiles
# Secrets: wifi_ssid, wifi_password, collector_host, panel_id, panel_api_key

substitutions:
  panel_poll_interval: "60s"

esphome:
  name: ${name}
  friendly_name: ${friendly_name}
  min_version: 2024.6.0

esp32:
  board: esp32dev
  framework:
    type: esp-idf

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: "${friendly_name} Fallback"
    password: !secret wifi_password

captive_portal:

api:
  encryption:
    key: !secret api_encryption_key

ota:
  - platform: esphome
    password: !secret ota_password

logger:
  baud_rate: 0

uart:
  id: uart_nextion
  tx_pin: GPIO16
  rx_pin: GPIO17
  baud_rate: 115200

display:
  - platform: nextion
    id: nextion_display
    uart_id: uart_nextion
    update_interval: never
    auto_wake_on: never

http_request:
  id: http_req
  timeout: 10s
  verify_ssl: false

globals:
  - id: usage_json
    type: std::string
    initial_value: '""'

interval:
  - interval: ${panel_poll_interval}
    then:
      - http_request.get:
          url: !lambda |-
            return std::string("http://") + "${collector_host}" + ":8765/api/v1/panels/${panel_id}/usage";
          request_headers:
            Authorization: !secret panel_api_key_bearer
          capture_response: true
          on_response:
            then:
              - lambda: |-
                  if (response->status_code == 200) {
                    id(usage_json) = body;
                  }
      - lambda: |-
          // Push parsed values to Nextion components (t0, j0, j1, etc.)
          // Full JSON parsing requires ArduinoJson in a custom component — v0.1 stores raw JSON
          id(nextion_display).set_component_text("t0", id(usage_json).c_str());

# Physical buttons — cycle pages / wake (wire to your TFT page names)
binary_sensor:
  - platform: gpio
    pin:
      number: GPIO21
      mode: INPUT_PULLUP
      inverted: true
    name: "${friendly_name} Left Button"
    on_press:
      - lambda: 'id(nextion_display).send_command("page overview");'
  - platform: gpio
    pin:
      number: GPIO22
      mode: INPUT_PULLUP
      inverted: true
    name: "${friendly_name} Right Button"
    on_press:
      - lambda: 'id(nextion_display).send_command("page detail");'

sensor:
  - platform: wifi_signal
    name: "${friendly_name} WiFi Signal"
    update_interval: 60s
