name: MaxxMeter
version: "0.1.0"
slug: maxxmeter
description: Token maxxing dashboard for Sonoff NSPanel — Cursor, Claude, Kimi usage
url: https://github.com/dougrathbone/maxx-meter
arch:
  - aarch64
  - amd64
  - armv7
startup: application
boot: auto
init: false
ingress: true
ingress_port: 8099
panel: true
panel_title: MaxxMeter
panel_icon: mdi:gauge
ports:
  8765/tcp: 8765
ports_description:
  8765/tcp: NSPanel REST API
options:
  poll_interval_seconds: 300
  warn_pct: 70
  critical_pct: 90
  mqtt_host: core-mosquitto
  mqtt_port: 1883
  mqtt_username: ""
  mqtt_password: ""
  mqtt_topic_prefix: maxxmeter
  mqtt_tls: false
  ha_url: http://supervisor/core
  ha_token: ""
  bootstrap_office_panel: false
schema:
  poll_interval_seconds: int
  warn_pct: int
  critical_pct: int
  mqtt_host: str
  mqtt_port: port
  mqtt_username: str
  mqtt_password: password
  mqtt_topic_prefix: str
  mqtt_tls: bool
  ha_url: url
  ha_token: password
  bootstrap_office_panel: bool
map:
  - share:rw
args:
  GITHUB_REPOSITORY: dougrathbone/maxx-meter
  GITHUB_REF: main
